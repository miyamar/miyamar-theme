name: Release JetBrains

on:
  push:
    tags: ['jetbrains-v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # build.gradle.kts should read the token via
      # intellijPlatform { publishing { token = providers.environmentVariable("PUBLISH_TOKEN") } }
      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" build/distributions/*.zip --title "JetBrains ${GITHUB_REF_NAME#jetbrains-v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
