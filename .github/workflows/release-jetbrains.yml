name: Release JetBrains

on:
  push:
    tags: ['jetbrains-v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.0'

      - name: Check tag matches gradle.properties version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#jetbrains-v}"
          PROP_VERSION="$(sed -n 's/^pluginVersion *= *//p' gradle.properties)"
          if [ "$TAG_VERSION" != "$PROP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gradle.properties pluginVersion $PROP_VERSION"
            exit 1
          fi

      # build.gradle.kts reads the token from PUBLISH_TOKEN.
      - name: Publish to JetBrains Marketplace
        run: gradle publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" build/distributions/*.zip --title "JetBrains ${GITHUB_REF_NAME#jetbrains-v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
